services:
  webserver:
    build:
      context: "./setup/bin/${PHPVERSION}"
    container_name: "${COMPOSE_PROJECT_NAME}-${PHPVERSION}"
    restart: unless-stopped
    volumes:
      - ${DOCUMENT_ROOT-./www}:/var/www/html:rw
      - ${PHP_INI-./setup/config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${SSL_DIR-./setup/config/ssl}:/etc/apache2/ssl/
      - ${VHOSTS_DIR-./setup/config/vhosts}:/etc/apache2/sites-enabled
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
      - ${XDEBUG_LOG_DIR-./logs/xdebug}:/var/log/xdebug
    environment:
      PHP_IDE_CONFIG: serverName=localhost
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_MACHINE_MYSQL_PORT: ${HOST_MACHINE_MYSQL_PORT}
      PHP_XDEBUG_MODE: ${PHP_XDEBUG_MODE-off}
      #FEATURES_ENABLED: ENABLE_APPS_ICON,ENABLE_PUBLIC_PATIENT
      #XDEBUG_CONFIG: "client_host=host.docker.internal client_port=${XDEBUG_PORT} remote_port=${XDEBUG_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /var/www/html/w

  database:
    build:
      context: "./setup/bin/${DATABASE}"
    container_name: "${COMPOSE_PROJECT_NAME}-${DATABASE}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ${MYSQL_INITDB_DIR-./setup/config/initdb}:/docker-entrypoint-initdb.d
      - ${MYSQL_LOG_DIR-./logs/mysql}:/var/log/mysql
      - ./setup/files/mysql_password.txt:/mysql_password.txt
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /mysql_password.txt

  redis_job:
    container_name: "${COMPOSE_PROJECT_NAME}-redis_job"
    image: redis:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_MACHINE_REDIS_PORT}:6379"

  caddy:
    image: caddy:2.4.6-alpine
    restart: unless-stopped
    links:
      - webserver
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
    #  - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    volumes:
      - mailhog:/home/mailhog/maildir
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/home/mailhog/maildir
    ports:
      - "127.0.0.1:${HOST_MAILHOG_WEB_PORT}:8025"

volumes:
  caddy-data:
  mailhog:
  mysql-data:
